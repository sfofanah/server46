  <body>
     
    <!-- Bootstrap TWDS Introduction Section Notes -> index.html 
     
    <main>

        <section class="py-5">

        </section>

    </main>
    
        main: semantic tag that means “main content area of the page”
        section: semantic tag that means “a section of related content”
        py-5: Bootstrap spacing utility that adds vertical padding (top + bottom) of size 5 (3rem or 48px)

    -------------------------------------------------------------------------------

    Bootstrap TWDS Introduction Section Notes -> index.html 
     
    <main>

        <section class="py-5">

            <div class="container">

                <div class="text-center mb-4">

                    <h1 class="h1-style fw-bold mb-3">Welcome to The Walking Dead Survivors Guide!</h1>
                    <p class="lead">Your hub for formations, strategies, and meta analysis</p>

                </div>

                <div class="text-center">

                    <img src="images/TWDS Background.jpg" alt="The Walking Dead Survivors banner" class="img-fluid rounded shadow-lg">

                </div>

            </div>

        </section>

    </main>
    
        .container: Bootstrap layout wrapper that centers content, adds horizontal padding, and keeps it aligned with the rest of the page
        text-center: Bootstrap text alignment utility that centers text
        mb-4: Bootstrap spacing utility that adds bottom margin of size 4 (1.5rem or 24px)
        fw-bold: Bootstrap font weight utility that makes text bold
        mb-3: Bootstrap spacing utility that adds bottom margin of size 3 (1rem
        or 16px)
        lead: Bootstrap typography class that styles text as a lead paragraph with larger font size and lighter weight
        img-fluid: Bootstrap image utility that makes the image responsive by setting its max-width to 100% and height to auto
        rounded: Bootstrap image utility that adds rounded corners to the image
        shadow-lg: Bootstrap utility that adds a large shadow to the image  
        h1-style: custom class defined in index2.css to style the h1 element with responsive font size, text shadow, and letter spacing
    -------------------------------------------------------------------------------

    -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>

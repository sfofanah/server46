  <body>
    
    <!-- Bootstrap Navbar Section Notes -> index.html 
    -------------------------------------------------------------------------------
    Example Navbar Code:
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-black"></nav>

        <nav>: semantic tag that means “navigation area”

        class="navbar": turns it into a Bootstrap navbar component (Bootstrap applies default spacing + layout)

        navbar-expand-lg: collapses the menu on small screens, and expands (shows full links) at lg and up

        navbar-dark: tells Bootstrap “this navbar is on a dark background” so it uses light text/icons

        bg-black: gives the navbar a black background (Bootstrap utility class)
    
    -------------------------------------------------------------------------------
    Example Container Code:
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
        
        <div class="container"></div>
    
    </nav>
    
        .container is a Bootstrap layout wrapper

        Centers your content

        Adds consistent horizontal padding

        Keeps the navbar aligned with the rest of the page

        Without it, the navbar stretches edge-to-edge (which usually looks sloppy)
            
    -------------------------------------------------------------------------------
    Example logo Code:
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
        
        <div class="container">

            <a class="navbar-brand" href="index.html">

                <img src="images/Logo3.png" alt="The Walking Dead Survivors Logo" width="120" height="60">
            
            </a>
        
        </div>
    
    </nav>

        <a>: semantic tag that means “link”

        class="navbar-brand": styles it as the navbar’s brand/logo link

        href="index.html": clicking the logo takes you to the homepage

        <img>: the logo image itself

        src="images/Logo3.png": path to the logo image file

        alt="The Walking Dead Survivors Logo": descriptive text for screen readers (accessibility)

        width="120" height="60": sets the logo size

    -------------------------------------------------------------------------------
    Example Hamburger Button/icon Code:
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
        
        <div class="container">

            <a class="navbar-brand" href="index.html">

                <img src="images/Logo3.png" alt="The Walking Dead Survivors Logo" width="120" height="60">
            
            </a>

            <button

                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNav"
                aria-controls="mainNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
                
                <span class="navbar-toggler-icon"></span>
            
            </button>
            
            <div class="collapse navbar-collapse" id="mainNav"></div>

        </div>
          
    </nav>  

        <button>: the clickable button that toggles the menu on small screens

        class="navbar-toggler": styles it as the navbar toggle button

        type="button": specifies it’s a button

        data-bs-toggle="collapse": tells Bootstrap this button will toggle a collapsible element

        data-bs-target="#mainNav": specifies the ID of the collapsible menu to toggle

        aria-controls="mainNav": accessibility attribute linking button to menu

        aria-expanded="false": accessibility attribute indicating menu is initially collapsed

        aria-label="Toggle navigation": accessibility label describing the button’s function

        <span class="navbar-toggler-icon"></span>: the icon inside the button (three horizontal lines)
        
        collapse navbar-collapse: styles the menu as collapsible and expanded on larger screens
    -------------------------------------------------------------------------------
    Example Collapsible Menu List Items Code:

    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
        
        <div class="container">

            <a class="navbar-brand" href="index.html">

                <img src="images/Logo3.png" alt="The Walking Dead Survivors Logo" width="120" height="60">
            
            </a>

            <button

                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNav"
                aria-controls="mainNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
                
                <span class="navbar-toggler-icon"></span>
            
            </button>
            
            <div class="collapse navbar-collapse" id="mainNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a class="nav-link" href="clans.html">Clans</a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link" href="leaders.html">Leaders</a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link" href="guides.html">Guides</a>

                    </li>
                
                </ul>
    
            </div>

        </div>

    </nav>

        <ul class="navbar-nav ms-auto">: the menu list container

        navbar-nav: styles it as a navbar menu

        ms-auto: pushes the menu to the right side (auto left margin)

        <li class="nav-item">: each individual menu item

        nav-item: styles it as a navbar item

        <a class="nav-link" href="clans.html">Clans</a>: the clickable link inside each menu item

        nav-link: styles it as a navbar link

        href="clans.html": the page it links to when clicked
-->

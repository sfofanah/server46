<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice JS</title>
</head>

<body>
    
    <h1>Practice JavaScript</h1>

    <!-- Week 1 -->
    <section>
        <h2>Variables</h2>
        <p>In JavaScript, you can declare variables using <strong>var</strong>, <strong>let</strong>, or <strong>const</strong>.</p>
        <p>The <strong>let</strong> variable can be changed later in the code, unlike <strong>const</strong> which is constant.</p>
        <p id="Example-1"></p>
    </section>
   
    <script>
        
        // Declaring variables
        let name = "John";
        let age = 30;

        // Displaying the variables in the console
        console.log("Name: " + name);
        console.log("Age: " + age);
        
        // Get <p> ID elements from the HTML
        document.getElementById("Example-1").innerHTML = "Name: " + name + "<br>Age: " + age;
      

    </script>

</body>

</html>
